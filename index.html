<style>
/* =============== Theme tokens =============== */
:root{
  --bg:#f3efe6; --side:#ebe5d8; --card:#faf8f3; --card-2:#f1ece1; --line:#d8d0bf; --line-2:#c4baa5;
  --text:#1f1d1a; --text-2:#3d3a34; --muted:#6e685c; --dim:#8d8678;
  --accent:#c4623f; --accent-2:#b0532f; --accent-ink:#fff; --accent-soft:#f3dfd3;
  --cyan:#c4623f; --green:#4f7a52; --green-soft:#e1eadb; --amber:#b9812b; --violet:#6f5fa8;
  --grid:rgba(60,50,30,.055); --shadow:0 1px 0 rgba(40,30,10,.04);
  --paper:#fffdf9; --paper-ink:#1f1d1a;
  --serif:"Source Serif 4",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --side-w:272px; --r:4px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a17; --side:#201f1b; --card:#24221e; --card-2:#1e1c19; --line:#36332c; --line-2:#4a463c;
    --text:#ece7dc; --text-2:#cfc9bc; --muted:#a39c8e; --dim:#7d776b;
    --accent:#d97757; --accent-2:#e58a6b; --accent-ink:#1b1a17; --accent-soft:#3a2a22;
    --cyan:#d97757; --green:#8cb38e; --green-soft:#26302a; --amber:#d9a54e; --violet:#a99be0;
    --grid:rgba(255,240,210,.035); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1a17; --side:#201f1b; --card:#24221e; --card-2:#1e1c19; --line:#36332c; --line-2:#4a463c;
  --text:#ece7dc; --text-2:#cfc9bc; --muted:#a39c8e; --dim:#7d776b;
  --accent:#d97757; --accent-2:#e58a6b; --accent-ink:#1b1a17; --accent-soft:#3a2a22;
  --cyan:#d97757; --green:#8cb38e; --green-soft:#26302a; --amber:#d9a54e; --violet:#a99be0;
  --grid:rgba(255,240,210,.035); --shadow:none; color-scheme:dark;
}

/* =============== Base =============== */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--text);font:15.5px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
b,strong{color:var(--text);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* =============== Sidebar =============== */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.me{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.photo{width:100%;aspect-ratio:1;border-radius:var(--r);overflow:hidden;border:1px solid var(--line-2);background:repeating-linear-gradient(135deg,var(--card-2) 0 8px,var(--card) 8px 16px);display:flex;align-items:center;justify-content:center;font:600 54px var(--serif);color:var(--accent);position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.me h1{font:600 22px/1.2 var(--serif);margin:14px 0 4px;letter-spacing:-.01em}
.me .role{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font:500 11.5px var(--mono);color:var(--muted)}
.status i{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 0 3px var(--green-soft)}
.nav{list-style:none;margin:0;padding:12px;display:grid;gap:2px;flex:1;overflow:auto;counter-reset:nav}
.nav li{counter-increment:nav}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r);color:var(--muted);font-weight:500;font-size:14.5px;border:1px solid transparent}
.nav a::after{content:"0" counter(nav);margin-left:auto;font:500 10.5px var(--mono);color:var(--dim)}
.nav a:hover{background:var(--card);color:var(--text);text-decoration:none}
.nav a.on{background:var(--card);border-color:var(--line-2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav a.on svg,.nav a.on::after{color:var(--accent)}
.side-foot{border-top:1px solid var(--line);padding:14px 20px 18px;font-size:12.5px;color:var(--muted)}
.side-foot .mail{display:flex;align-items:center;gap:8px;color:var(--muted);word-break:break-all;font-family:var(--mono);font-size:11.5px}
.socials{display:flex;gap:8px;margin-top:12px}
.socials a,.theme-btn{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--muted);background:transparent;cursor:pointer;padding:0}
.socials a:hover,.theme-btn:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.theme-btn{margin-left:auto}

/* mobile top bar + drawer */
.topbar{display:none}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .25s ease;width:min(84vw,300px);box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.menu .side{transform:none}
  body.menu{overflow:hidden}
  .topbar{display:flex;position:sticky;top:0;z-index:15;align-items:center;gap:12px;padding:10px 16px;min-height:56px;background:color-mix(in srgb,var(--side) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar .tb-av{width:32px;height:32px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font:600 14px var(--serif);color:var(--accent);background:var(--card);position:relative;flex:none}
  .topbar .tb-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .topbar .tb-t{flex:1;min-width:0;line-height:1.2}
  .topbar b{display:block;font:600 16px var(--serif)}
  .topbar small{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar button{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .scrim{display:none;position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:18}
  body.menu .scrim{display:block}
}

/* =============== Main =============== */
main{margin-left:var(--side-w);min-height:100vh}
@media (max-width:900px){main{margin-left:0}}
.page{max-width:900px;margin:0 auto;padding:44px 28px 100px;animation:fade .3s ease;counter-reset:sec}
@media (max-width:600px){.page{padding:26px 16px 96px}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}html{scroll-behavior:auto}}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pill::before{content:"";width:18px;height:1px;background:var(--accent)}
.page h2.title{font:600 clamp(32px,5.4vw,48px)/1.08 var(--serif);margin:14px 0 14px;letter-spacing:-.025em}
.lede{color:var(--text-2);font-size:17px;max-width:640px;margin:0 0 24px}
@media (max-width:600px){.lede{font-size:16px}}
h3.sec{counter-increment:sec;display:flex;align-items:center;gap:10px;font:600 22px var(--serif);margin:52px 0 16px;padding-top:14px;border-top:1px solid var(--line);letter-spacing:-.01em}
h3.sec::before{content:"§ 0" counter(sec);font:500 11px var(--mono);letter-spacing:.08em;color:var(--accent);margin-right:2px}
h3.sec svg{display:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;min-height:42px;border-radius:var(--r);font:500 14px var(--sans);border:1px solid var(--line-2);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none!important;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn:active{transform:translateY(1px)}
@media (max-width:520px){.page>.btns .btn,.band .btns .btn,.cta .btns .btn{flex:1 1 100%}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow);position:relative}
@media (max-width:600px){.card{padding:18px}}
.mono{font-family:var(--mono)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 11.5px var(--mono);color:var(--text-2);background:var(--card-2);border:1px solid var(--line);padding:2px 8px;border-radius:2px}
.label{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
ul.dots{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.dots li{position:relative;padding-left:20px;color:var(--text-2)}
ul.dots li::before{content:"";position:absolute;left:2px;top:.7em;width:8px;height:1.5px;background:var(--accent)}
ul.checks{margin:0;padding:0;list-style:none;display:grid;gap:9px}
ul.checks li{display:flex;gap:10px;color:var(--text-2);font-size:14.5px}
ul.checks li svg{margin-top:4px;width:14px;height:14px;color:var(--accent)}
ul.checks.star li svg{color:var(--green)}
.p-body{margin:0 0 12px;color:var(--text-2)}
.p-body:last-child{margin:0}
.sm-muted{margin:8px 0 0;color:var(--muted);font-size:14px}
.school{color:var(--accent);font-size:14.5px}

/* filters */
.filters{display:flex;gap:0;margin:32px 0 22px;border:1px solid var(--line-2);border-radius:var(--r);overflow-x:auto;scrollbar-width:none;background:var(--card);width:fit-content;max-width:100%}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);font:500 12px var(--mono);letter-spacing:.04em;padding:10px 14px;cursor:pointer;white-space:nowrap}
.filters button:last-child{border-right:0}
.filters button:hover{color:var(--text)}
.filters button.on{color:var(--accent-ink);background:var(--text)}

/* project */
.proj{margin-bottom:22px}
.proj::before,.svc::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--accent);border-top:2px solid var(--accent)}
.proj-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.cat{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:2px}
.when{font:500 12px var(--mono);color:var(--dim);white-space:nowrap}
.proj h4{font:600 clamp(21px,3vw,25px)/1.25 var(--serif);margin:14px 0 4px;letter-spacing:-.015em}
.proj .r{color:var(--green);font:500 13px var(--mono)}
.browser{margin:18px 0;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--card-2)}
.browser .bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--side)}
.browser .bar i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line-2);background:var(--card)}
.browser .bar i:first-child{background:var(--accent);border-color:var(--accent)}
.browser .url{flex:1;min-width:0;max-width:420px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:6px;font:500 11px var(--mono);color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:2px;padding:3px 10px;white-space:nowrap;overflow:hidden}
.browser .url svg{width:11px;height:11px}
.shot{aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/20px 20px,var(--card-2)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.shot .ph{text-align:center;color:var(--dim);font:500 11px var(--mono);letter-spacing:.06em;padding:0 16px}
.shot .ph b{display:block;font:600 clamp(20px,3.6vw,30px) var(--serif);color:var(--text-2);letter-spacing:-.01em;margin-bottom:6px;text-transform:none}
.proj p.d{color:var(--text-2);margin:0 0 18px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--card-2);margin-bottom:22px}
.metric{padding:14px 16px}
.metric+.metric{border-left:1px dashed var(--line-2)}
@media (max-width:520px){.metrics{grid-template-columns:1fr}.metric+.metric{border-left:0;border-top:1px dashed var(--line-2)}.metric{display:flex;justify-content:space-between;align-items:baseline;gap:12px}}
.metric b{display:block;font:500 22px var(--serif);color:var(--text)}
.metric span{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.proj .label{margin:0 0 10px}
.proj .tags{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.proj .links{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font:500 13px var(--mono)}

/* services */
.svc{margin-bottom:22px}
.svc .num{font:500 13px var(--mono);color:var(--accent);margin-right:10px}
.svc .kind{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--green);background:var(--green-soft);padding:3px 8px;border-radius:2px}
.svc h4{font:600 clamp(21px,3vw,25px)/1.25 var(--serif);margin:14px 0 6px;letter-spacing:-.015em}
.svc .sub{color:var(--muted);margin:0;padding-bottom:18px;border-bottom:1px solid var(--line)}
.problem{margin:18px 0 22px;border-left:2px solid var(--amber);padding:2px 0 2px 14px}
.problem .label{color:var(--amber);display:flex;align-items:center;gap:6px}
.problem .label svg{width:13px;height:13px}
.problem p{margin:4px 0 0;color:var(--text-2);font-size:14.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:700px){.cols{grid-template-columns:1fr;gap:22px}}
.cols .label{color:var(--text);margin-bottom:12px}
.note{margin-top:16px;background:var(--card-2);border:1px dashed var(--line-2);border-radius:var(--r);padding:12px 14px}
.note .label{color:var(--accent);margin:0 0 4px}
.note p{margin:0;font-size:13.5px;color:var(--muted)}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.track{display:flex;flex-direction:column;gap:12px}
.track.hl{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.track .label{color:var(--accent)}
.track h4{margin:0;font:600 21px var(--serif)}
.track p{margin:0;color:var(--muted);font-size:14.5px}
.track .btn{margin-top:auto}
.cta{margin-top:34px;text-align:center;padding:40px 24px;background:var(--text);color:var(--bg);border-color:var(--text)}
.cta .pill{color:var(--accent-2)}.cta .pill::before{background:var(--accent-2)}
.cta h4{font:600 clamp(23px,3.4vw,32px)/1.2 var(--serif);margin:12px auto 10px;letter-spacing:-.02em;max-width:620px;color:var(--bg)}
.cta p{color:color-mix(in srgb,var(--bg) 70%,transparent);max-width:520px;margin:0 auto 22px}
.cta .btns{justify-content:center}
.cta .btn:not(.pri){background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.cta .btn:not(.pri):hover{border-color:var(--bg)}
.band{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-top:34px;background:var(--card-2);border-style:dashed;border-color:var(--line-2)}
.band h4{margin:0 0 4px;font:600 19px var(--serif)}
.band p{margin:0;color:var(--muted);font-size:14.5px}
@media (max-width:520px){.band .btns{width:100%}}

/* timeline */
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;border-left:1px dashed var(--line-2)}
@media (max-width:520px){.tl{padding-left:20px}.tl::before{left:3px}}
.job{position:relative;margin-bottom:18px}
.job::before{content:"";box-sizing:border-box;position:absolute;left:-24.5px;top:38px;width:14px;height:14px;background:var(--bg);border:2px solid var(--accent);transform:translate(-50%,-50%) rotate(45deg)}
@media (max-width:600px){.job::before{top:30px}}
@media (max-width:520px){.job::before{left:-17.5px;width:12px;height:12px}}
.job.now::before{background:var(--accent)}
.job-head{display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.job h4{margin:0;font:600 20px/1.3 var(--serif);letter-spacing:-.01em}
.job .co{margin-top:3px;font-size:14px;color:var(--muted)}
.job .co strong{color:var(--accent);font-weight:600}
.job .dates{text-align:right;font:500 12.5px var(--mono)}
.job .dates small{display:block;color:var(--dim);font-size:11.5px}
@media (max-width:600px){.job .dates{text-align:left}.job .dates small{display:inline;margin-left:6px}}
.job blockquote{margin:12px 0 0;border-left:2px solid var(--line-2);padding-left:12px;color:var(--muted);font:italic 15px var(--serif)}
.job .label{color:var(--text);margin:18px 0 10px}
.job .tags{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.now-badge{display:inline-block;margin-left:8px;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:var(--green-soft);border-radius:2px;padding:2px 7px;vertical-align:4px}

/* about */
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:14.5px;margin:0}
.facts dt{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0;font-weight:600}
@media (max-width:520px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:10px}}
.matrix-wrap{padding:6px 12px}
.matrix{width:100%;border-collapse:collapse;font-size:14.5px}
.matrix th,.matrix td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.matrix th{width:30%;font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:15px}
.matrix td{color:var(--text-2)}
.matrix tr:last-child th,.matrix tr:last-child td{border-bottom:0}
@media (max-width:600px){.matrix th,.matrix td{display:block;width:auto;border:0;padding:2px 0}.matrix tr{display:block;padding:12px 0;border-bottom:1px solid var(--line)}.matrix tr:last-child{border-bottom:0}}
.edu{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.edu h4{margin:0;font:600 19px var(--serif)}
.chipyear{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--line-2);border-radius:2px;padding:3px 10px;height:fit-content}

/* contact */
.form{display:grid;gap:16px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.form .row{grid-template-columns:1fr}}
.form label{display:grid;gap:6px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r);color:var(--text);font:16px var(--sans);padding:11px 12px;outline:none;width:100%;text-transform:none;letter-spacing:0}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form textarea{min-height:150px;resize:vertical}
.privacy{display:flex;gap:8px;font-size:13px;color:var(--dim);margin:0}
.privacy svg{margin-top:3px}
@media (max-width:520px){.form .btn{width:100%}}
.ccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;margin-top:18px}
.ico{width:38px;height:38px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);color:var(--accent);margin-bottom:14px}
.ico.v{color:var(--violet)}.ico.a{color:var(--amber)}
.ccards .label{margin-bottom:6px}
.ccards .big{font:600 18px var(--serif);word-break:break-word}
.ccards .row2{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ccards .row2 .btn{flex:1;padding:8px 12px;font-size:13.5px}
.plist{display:grid;gap:6px;font-size:14px;color:var(--muted);word-break:break-word}

/* resume paper */
.cvbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 24px;background:color-mix(in srgb,var(--side) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.cvbar .crumb{display:flex;align-items:center;gap:10px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.cvbar .crumb a{display:inline-flex;align-items:center;gap:6px;color:var(--text);border:1px solid var(--line-2);border-radius:var(--r);padding:5px 10px;text-transform:none;letter-spacing:0}
@media (max-width:900px){.cvbar{top:56px;padding:8px 16px}}
@media (max-width:520px){.cvbar .crumb span{display:none}.cvbar .btn{padding:8px 12px;font-size:13px}}
.paper{max-width:820px;margin:28px auto 100px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:var(--r);padding:52px 56px;box-shadow:0 18px 50px rgba(40,25,10,.12);font-size:13.5px;line-height:1.6;
  --text:#1f1d1a;--text-2:#3d3a34;--muted:#6e685c;--accent:#b0532f}
@media (max-width:700px){.paper{margin:14px 12px 90px;padding:26px 18px}}
.paper b,.paper strong{color:#1f1d1a}
.paper h1{margin:0;font:600 34px/1.1 var(--serif);letter-spacing:-.02em}
.paper .ttl{color:var(--accent);font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
.paper .contacts{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 8px}
.paper .contacts span,.paper .contacts a{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--mono);border:1px solid #ddd5c4;border-radius:2px;padding:3px 9px;color:#3d3a34;word-break:break-all}
.paper .contacts svg{width:12px;height:12px}
.paper h2{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin:28px 0 12px;padding-bottom:7px;border-bottom:1.5px solid #1f1d1a;color:#1f1d1a}
.paper h2 svg{color:var(--accent);width:14px;height:14px}
.paper p{margin:0 0 8px}
.paper table{width:100%;border-collapse:collapse}
.paper th,.paper td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid #e6dfd1;vertical-align:top;font-size:13px}
.paper th{width:26%;font-weight:600}
@media (max-width:520px){.paper th,.paper td{display:block;width:auto;border:0;padding:1px 0}.paper tr{display:block;padding:7px 0;border-bottom:1px solid #e6dfd1}}
.paper .x{margin-bottom:18px;break-inside:avoid}
.paper .xh{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}

  .m-profile b{display:block;font:600 19px/1.2 var(--serif)}
  .m-profile small{display:block;margin-top:3px;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  .m-profile em{display:block;margin-top:4px;font:600 11px var(--mono);font-style:normal;letter-spacing:.04em;color:var(--green)}
}
@media (max-width:640px) and (prefers-reduced-motion:reduce){.mp-img.is-open::before{animation:none}}
@media (max-width:640px){.hero-eyebrow{margin-bottom:0}}
@media (min-width:641px) and (max-width:900px){
  .hp-tag{font-size:9.5px;padding:5px 10px 5px 8px;gap:6px}
  .hero-photo figcaption b{font-size:17px}
  .hero-photo figcaption small{font-size:9.5px}
  .hero-photo figcaption{left:-14px;right:-14px}
  .hero-photo figcaption small{display:block;line-height:1.35}
}
/* hero buttons: one row when they fit; otherwise a tidy 1 + 2 block; stacked on narrow phones */
.hero-txt{container-type:inline-size;container-name:herotxt}
@container herotxt (max-width:560px){
  .hero-txt .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hero-txt .btns .btn{justify-content:center;width:100%;min-width:0}
  .hero-txt .btns .btn.pri{grid-column:1 / -1}
}
@container herotxt (max-width:420px){
  .hero-txt .btns{grid-template-columns:1fr}
}
/* project filters: one segmented row when it fits, otherwise an even grid (same segmented look) */
.page{container-type:inline-size;container-name:page}
@container page (max-width:600px){
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:1px;width:100%;background:var(--line);overflow:hidden}
  .filters button{border:0!important;background:var(--card);padding:11px 10px;text-align:center;white-space:normal;line-height:1.3}
  .filters button:last-child:nth-child(odd){grid-column:1 / -1}
  .filters button.on{background:var(--text);color:var(--accent-ink)}
}
/* filters centred at every size */
.filters{margin-left:auto;margin-right:auto}
/* ================= footer (rebuilt) ================= */
.site-foot{border-top:1px solid var(--line);margin-top:24px}
.sf-in{max-width:900px;margin:0 auto;padding:26px 28px 96px;display:block;font:inherit;color:var(--muted)}
.sf-top{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.sf-id{display:flex;flex-direction:column;gap:3px;min-width:0}
.sf-id b{font:600 18px var(--serif);color:var(--text)}
.sf-id span{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sf-links{display:flex;flex-wrap:wrap;gap:8px}
.sf-links a{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 13px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);color:var(--text-2);font:500 12.5px var(--mono);text-decoration:none!important;white-space:nowrap;transition:border-color .15s,color .15s}
.sf-links a:hover{border-color:var(--accent);color:var(--accent)}
.sf-links svg{width:14px;height:14px}
.sf-bot{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);font:500 12px var(--mono);color:var(--dim)}
.sf-bot .sf-k{display:inline-flex;align-items:center;gap:7px;margin:0;padding:0;border:0;background:none;color:var(--dim);font:inherit;cursor:pointer}
.sf-bot .sf-k:hover{color:var(--accent)}
.sf-bot .sf-k svg{width:13px;height:13px}
.sf-bot kbd{margin:0 1px}
@media (max-width:700px){
  .sf-in{padding:24px 16px 96px}
  .sf-top{flex-direction:column;align-items:stretch}
  .sf-links{display:grid;grid-template-columns:1fr 1fr}
  .sf-links .sf-mail{grid-column:1 / -1}
  .sf-bot .sf-k{display:none}
}
/* ================= simple footer ================= */
.sf-in.sf-simple{max-width:900px;margin:0 auto;padding:22px 28px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;font:500 12.5px var(--mono);color:var(--muted)}
.sf-simple .sf-copy{color:var(--text-2)}
.sf-simple .sf-links{display:flex;align-items:center;gap:22px;flex-wrap:nowrap}
.sf-simple .sf-links a{display:inline-flex;align-items:center;justify-content:flex-start;gap:7px;height:auto;padding:0;border:0;background:none;color:var(--muted);font:inherit;white-space:nowrap}
.sf-simple .sf-links a:hover{color:var(--accent);text-decoration:none}
.sf-simple .sf-links svg{width:14px;height:14px}
.site-foot{margin-top:24px}
@media (max-width:700px){
  .sf-in.sf-simple{padding:18px 16px 22px;flex-direction:row;align-items:center;gap:12px}
}
/* the footer already has the contact links, so the floating button steps aside */
.fab{transition:opacity .25s ease,transform .25s ease}
html.foot-in-view .fab{opacity:0;transform:translateY(12px);pointer-events:none}
/* footer links: icon-only at every size */
@media all{
  .sf-simple .sf-links{display:flex;gap:8px}
  .sf-simple .sf-links a{width:34px;height:34px;justify-content:center;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);transition:color .15s,border-color .15s,transform .15s}
  .sf-simple .sf-links a span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sf-simple .sf-links a svg{width:15px;height:15px}
  .sf-simple .sf-links a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
}
/* tighter space between page content and footer */
.page{padding-bottom:44px}
@media (max-width:600px){.page{padding-bottom:32px}}
.site-foot{margin-top:0}
.paper{margin-bottom:44px}
@media (max-width:700px){.paper{margin-bottom:28px}}
.page>.proj:last-child,.page>.svc:last-child{margin-bottom:0}
#about-summary,#about-skills,#about-education,#about-tracks{scroll-margin-top:76px}
.matrix tr.flash th,.matrix tr.flash td{animation:rowflash 1.6s ease}
@keyframes rowflash{0%,35%{background:var(--accent-soft)}100%{background:transparent}}
</style>
</head>

function route(forced){

document.addEventListener('click', e => {

  if (e.target.closest('.pf-menu')) window.__pfHold = true;
  const a = e.target.closest('a[href^="#/"]');
  if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey){
    e.preventDefault();
    const key = a.getAttribute('href').slice(2);
    try { history.pushState(null, '', '#/' + key); } catch(_) {}
    route(key);
    return;
  }
  const f = e.target.closest('[data-f]');
  if (f){ filter = f.dataset.f; const y = scrollY; document.getElementById('view').innerHTML = pages.showcase(); scrollTo(0, y); }
  if (e.target.closest('#themeBtn')){
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('theme', r.dataset.theme); } catch(_){}
  }
  if (e.target.closest('#copyMail')){
    navigator.clipboard?.writeText(SITE.email).then(() => toast('Email copied'), () => toast(SITE.email));

});

function palRender(){
  const q = document.getElementById('palInput').value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const score = it => { const l = it.label.toLowerCase(); let s = 0;
    for (const w of words){ if (l.startsWith(w)) s += 30; else if (l.includes(w)) s += 20; else if ((it.hint+' '+it.g).toLowerCase().includes(w)) s += 8; else if ((it.keys||'').toLowerCase().includes(w)) s += 3; else return -1; }
    return s; };
  const order = ['Pages','Projects','Services','Experience','About','Skills','Links','Actions'];
  PAL.view = PAL.items.map(it => ({ it, s: words.length ? score(it) : 0 })).filter(x => x.s >= 0);
  if (words.length){
    const best = {}; PAL.view.forEach(x => { best[x.it.g] = Math.max(best[x.it.g] || 0, x.s); });
    PAL.view.sort((a,b) => (best[b.it.g] - best[a.it.g]) || (order.indexOf(a.it.g) - order.indexOf(b.it.g)) || (b.s - a.s));
  }
  PAL.view = PAL.view.map(x => x.it);
  if (!q){
    const order = ['Pages','Projects','Services','Experience','About','Links'];
    PAL.view = PAL.view.filter(it => order.includes(it.g) && !it.searchOnly).sort((a,b) => order.indexOf(a.g) - order.indexOf(b.g));
  }
  PAL.active = Math.min(PAL.active, Math.max(0, PAL.view.length - 1));
  let html = '', grp = '';
  PAL.view.forEach((it, i) => {
    if (it.g !== grp){ grp = it.g; html += `<div class="pal-g">${esc(grp)}</div>`; }
    html += `<div class="pal-row${i===PAL.active?' on':''}" role="option" id="pal-${i}" aria-selected="${i===PAL.active}" data-i="${i}">${ic(it.icon)}<span class="pl">${esc(it.label)}</span><span class="ph">${esc(it.hint)}</span></div>`;
  });
  document.getElementById('palList').innerHTML = html || `<div class="pal-empty">No matches for “${esc(q)}”</div>`;
  document.getElementById('palInput').setAttribute('aria-activedescendant', PAL.view.length ? 'pal-' + PAL.active : '');
  const on = document.querySelector('.pal-row.on'); if (on) on.scrollIntoView({ block:'nearest' });
}
function palOpen(){

function palClose(){
  if (!PAL.open) return;

}

}
document.addEventListener('click', e => {
  const trig = e.target.closest('.pf-trigger');
  if (trig){ e.preventDefault(); pfSet(!trig.closest('.pf').classList.contains('open')); return; }
  if (!e.target.closest('.pf')) pfSet(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') pfSet(false); });
document.addEventListener('mousemove', e => {
  if (!window.__pfHold) return;
  if (!e.target.closest('.pf')) { window.__pfHold = false; document.querySelectorAll('.cb-path .pf.hold').forEach(el => el.classList.remove('hold')); }
}, { passive:true });
document.getElementById('cbPrint').addEventListener('click', () => window.print());
document.getElementById('palVeil').addEventListener('click', palClose);
document.addEventListener('click', e => { if (e.target.closest('[data-open-palette]')) { e.preventDefault(); palOpen(); } });
document.getElementById('palList').addEventListener('mousemove', e => { const r = e.target.closest('.pal-row'); if (r && +r.dataset.i !== PAL.active){ PAL.active = +r.dataset.i; palRender(); } });
document.getElementById('palList').addEventListener('click', e => { const r = e.target.closest('.pal-row'); if (r) palRun(+r.dataset.i); });
document.getElementById('palInput').addEventListener('input', () => { PAL.active = 0; palRender(); });
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); PAL.open ? palClose() : palOpen(); return; }
  if (!PAL.open){
    const editable = typing || document.activeElement?.isContentEditable;
    if (e.key === '/' && !editable){ e.preventDefault(); palOpen(); }
    else if (/^[1-6]$/.test(e.key) && !editable && !e.metaKey && !e.ctrlKey && !e.altKey && !e.repeat){
      e.preventDefault();
      const k = NAV[+e.key - 1][0];
      goPage(k);
      document.activeElement?.blur?.();
    }
    return;
  }
  const inp = document.getElementById('palInput');
  if (e.key === 'Escape'){ e.preventDefault(); palClose(); }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); PAL.active = (PAL.active + 1) % Math.max(1, PAL.view.length); palRender(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); PAL.active = (PAL.active - 1 + PAL.view.length) % Math.max(1, PAL.view.length); palRender(); }
  else if (e.key === 'Enter'){ e.preventDefault(); palRun(PAL.active); }
  else if (/^[1-6]$/.test(e.key) && !inp.value){ e.preventDefault(); palClose(); goPage(NAV[+e.key - 1][0]); }
  else if (e.key === 'Tab'){ e.preventDefault(); inp.focus(); }
});
window.addEventListener('hashchange', () => route());
/* ---------- sidebar: drag the right edge to resize; drag narrow to collapse ---------- */
const SB = { MIN: 240, MAX: 380, SNAP_IN: 200, SNAP_OUT: 150 };
function setCollapsed(c){
  const r = document.documentElement;
  if (r.classList.contains('collapsed') === c) return;
  try { localStorage.setItem('sidebar', c ? 'collapsed' : 'open'); } catch(_){}
  clearTimeout(window._sbT1); clearTimeout(window._sbT2);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ r.classList.toggle('collapsed', c); }
  else {
    r.classList.add('sb-anim');                                                  // fade footer out
    window._sbT1 = setTimeout(() => r.classList.toggle('collapsed', c), 120);     // then resize
    window._sbT2 = setTimeout(() => r.classList.remove('sb-anim'), 120 + 380);    // fade footer back in
  }
  updateResizerLabel();
}
function setWidth(px){
  px = Math.round(Math.min(SB.MAX, Math.max(SB.MIN, px)));
  document.documentElement.style.setProperty('--side-open', px + 'px');
  try { localStorage.setItem('sidebarW', px); } catch(_){}
}
function updateResizerLabel(){
  const c = document.documentElement.classList.contains('collapsed');
  const el = document.getElementById('sbResizer');
  el.setAttribute('aria-valuetext', c ? 'Collapsed' : 'Expanded');
}
(() => {
  const el = document.getElementById('sbResizer'), r = document.documentElement;
  let dragging = false, snapping = false;
  const snapLock = () => { snapping = true; r.classList.remove('sb-dragging'); setTimeout(() => { snapping = false; if (dragging) r.classList.add('sb-dragging'); }, 480); };
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    dragging = true; el.setPointerCapture(e.pointerId);
    r.classList.add('sb-dragging', 'sb-resizing'); e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!dragging || snapping) return;
    const x = e.clientX, collapsed = r.classList.contains('collapsed');
    if (collapsed){
      if (x > SB.SNAP_OUT){ setWidth(Math.max(SB.MIN, x)); snapLock(); setCollapsed(false); }
    } else if (x < SB.SNAP_IN){ snapLock(); setCollapsed(true); }
    else setWidth(x);
  });
  const end = () => { if (!dragging) return; dragging = false; r.classList.remove('sb-dragging', 'sb-resizing'); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('dblclick', () => setCollapsed(!r.classList.contains('collapsed')));
  el.addEventListener('keydown', e => {
    const c = r.classList.contains('collapsed');
    const cur = parseInt(getComputedStyle(r).getPropertyValue('--side-open')) || 272;
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setCollapsed(!c); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); if (c) return; if (cur - 24 < SB.MIN) setCollapsed(true); else setWidth(cur - 24); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); if (c) setCollapsed(false); else setWidth(cur + 24); }
  });
  updateResizerLabel();
})();
window.addEventListener('popstate', () => route());
function setMenu(open){
  document.body.classList.toggle('menu', open);
  const b = document.getElementById('menuBtn');
  b.setAttribute('aria-expanded', open); b.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}
document.getElementById('menuBtn').addEventListener('click', () => setMenu(!document.body.classList.contains('menu')));
document.querySelector('.scrim').addEventListener('click', () => setMenu(false));
document.getElementById('side').addEventListener('click', e => { if (e.target.closest('.menu-close')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
route();
</script>
